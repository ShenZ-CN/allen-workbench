<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时汇率挂件 · EUR/CNY USD/CNY</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #ffffff;
    display: flex;
    flex-direction: column;
  }
  .ticker-wrap { flex: 0 0 auto; border-bottom: 1px solid #eef0f2; }
  .charts {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: #eef0f2;
    min-height: 260px;
  }
  .chart-cell { background: #ffffff; position: relative; }
  .tradingview-widget-container { width: 100%; height: 100%; }
  .tradingview-widget-container__widget { width: 100%; height: 100%; }
  @media (max-width: 640px) {
    .charts { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- 顶部：汇率行情滚动带 -->
<div class="ticker-wrap">
  <div class="tradingview-widget-container" style="height:46px;">
    <div class="tradingview-widget-container__widget"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
    {
      "symbols": [
        { "proName": "FX_IDC:EURCNY", "title": "欧元 / 人民币" },
        { "proName": "FX_IDC:USDCNY", "title": "美元 / 人民币" },
        { "proName": "FX:EURUSD", "title": "欧元 / 美元" }
      ],
      "showSymbolLogo": true,
      "isTransparent": true,
      "displayMode": "adaptive",
      "colorTheme": "light",
      "locale": "zh_CN"
    }
    </script>
  </div>
</div>

<!-- 下方：EUR/CNY 与 USD/CNY 迷你走势图 -->
<div class="charts">
  <div class="chart-cell">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
      {
        "symbol": "FX_IDC:EURCNY",
        "width": "100%",
        "height": "100%",
        "locale": "zh_CN",
        "dateRange": "6M",
        "colorTheme": "light",
        "isTransparent": true,
        "autosize": true,
        "largeChartUrl": "",
        "chartOnly": false
      }
      </script>
    </div>
  </div>
  <div class="chart-cell">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
      {
        "symbol": "FX_IDC:USDCNY",
        "width": "100%",
        "height": "100%",
        "locale": "zh_CN",
        "dateRange": "6M",
        "colorTheme": "light",
        "isTransparent": true,
        "autosize": true,
        "largeChartUrl": "",
        "chartOnly": false
      }
      </script>
    </div>
  </div>
</div>

</body>
</html>
